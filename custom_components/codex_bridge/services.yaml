start_task:
  fields:
    project_id:
      required: true
      example: prj_123456789abc
      selector:
        text:
    title:
      required: true
      example: Check the dashboard
      selector:
        text:
    prompt:
      required: true
      example: Review the dashboard configuration.
      selector:
        text:
          multiline: true
    mode:
      required: false
      default: observe
      selector:
        select:
          options:
            - observe
            - edit
            - full-auto
    model_override:
      required: false
      selector:
        text:
    thinking_override:
      required: false
      selector:
        text:
    task_id:
      required: false
      selector:
        text:

continue_task:
  fields:
    thread_id:
      required: true
      selector:
        text:
    prompt:
      required: true
      selector:
        text:
          multiline: true
    task_id:
      required: false
      selector:
        text:

cancel_task:
  fields:
    task_id:
      required: true
      selector:
        text:

get_task:
  fields:
    task_id:
      required: true
      selector:
        text:
