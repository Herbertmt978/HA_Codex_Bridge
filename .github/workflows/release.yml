name: Release Home Assistant App

on:
  push:
    branches: [main]
    paths:
      - "codex_bridge_app/config.yaml"
  workflow_dispatch:
    inputs:
      head_sha:
        description: Optional exact current main commit SHA to release.
        required: false
        type: string

permissions: {}

concurrency:
  group: release-app-main
  cancel-in-progress: false

jobs:
  validate:
    name: Lock the current main release input
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      expected_sha: ${{ steps.expected.outputs.expected_sha }}
      app_version: ${{ steps.versions.outputs.app_version }}
      integration_version: ${{ steps.versions.outputs.integration_version }}
      publish_integration: ${{ steps.versions.outputs.publish_integration }}
    steps:
      - name: Check out the triggering revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require one exact current main commit
        id: expected
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          expected_sha="${REQUESTED_HEAD_SHA:-${GITHUB_SHA}}"
          if [[ ! "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test -n "${main_sha}"
          test "${expected_sha}" = "${main_sha}"
          echo "expected_sha=${expected_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out the exact accepted main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.expected.outputs.expected_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate synchronized App release metadata and lock
        run: |
          python scripts/sync_app_release.py --check
          python scripts/update_codex_lock.py --check codex_bridge_app/codex-release.json

      - name: Resolve independently versioned release surfaces
        id: versions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          config = Path("codex_bridge_app/config.yaml").read_text(encoding="utf-8")
          changelog = Path("codex_bridge_app/CHANGELOG.md").read_text(encoding="utf-8")
          app_versions = re.findall(
              r'(?m)^version:\s*["\x27]?([0-9]+\.[0-9]+\.[0-9]+)["\x27]?\s*$',
              config,
          )
          headings = re.findall(r'(?m)^## ([0-9]+\.[0-9]+\.[0-9]+)\s*$', changelog)
          if len(app_versions) != 1 or not headings or headings[0] != app_versions[0]:
              raise SystemExit("App config.yaml and CHANGELOG.md release versions differ")

          manifest = json.loads(
              Path("custom_components/codex_bridge/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          integration_version = manifest.get("version")
          if (
              not isinstance(integration_version, str)
              or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", integration_version) is None
          ):
              raise SystemExit("Integration manifest must contain one stable version")

          app_version = app_versions[0]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"app_version={app_version}\n")
              output.write(f"integration_version={integration_version}\n")
              output.write(
                  "publish_integration="
                  f"{'true' if app_version == integration_version else 'false'}\n"
              )
          PY

  publish:
    name: Publish the verified App image
    needs: validate
    uses: ./.github/workflows/build-app.yml
    with:
      publish: true
      expected_sha: ${{ needs.validate.outputs.expected_sha }}
    permissions:
      attestations: write # Let the reusable builder record provenance.
      contents: read
      id-token: write # Let the reusable builder sign images and SBOMs.
      packages: write # Let the reusable builder publish GHCR objects.

  release-integration:
    name: Publish a matching Integration release
    needs: [validate, publish]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.validate.outputs.publish_integration == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create only the verified, exact-main Integration tag/release.
    steps:
      - name: Check out the exact published main commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.expected_sha }}

      - name: Require the checkout to remain the published App source
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Use the matching Integration release version
        id: version
        shell: bash
        env:
          APP_VERSION: ${{ needs.validate.outputs.app_version }}
          INTEGRATION_VERSION: ${{ needs.validate.outputs.integration_version }}
        run: |
          test "${APP_VERSION}" = "${INTEGRATION_VERSION}"
          echo "version=${INTEGRATION_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or verify the exact paired Integration release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.validate.outputs.expected_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python scripts/publish_integration_release.py
