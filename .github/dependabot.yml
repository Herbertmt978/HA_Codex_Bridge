version: 2
# Routine root npm tooling updates stay individual so the guarded workflow can
# evaluate one development dependency at a time. Production npm updates are
# grouped for manual review; GitHub Actions stay separate for their own gate.
# Docker stays separate because a base-image refresh must be reviewed together
# with the exact Alpine Chromium package pinned by the App image.
# Security alerts remain governed by GitHub's separate security-update settings.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      production-patch-minor:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Review jsdom majors separately before changing the supported Node floor.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      root-pip-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pip
    directory: "/bridge_service"
    schedule:
      interval: weekly
    groups:
      bridge-service-pip-patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pydantic is pinned transitively by the Home Assistant test fixture and
      # must move with the repository's Home Assistant compatibility version.
      - dependency-name: "pydantic"
        versions:
          - ">=2.13.5"
      # The pinned Home Assistant test fixture requires pytest==9.0.3.
      - dependency-name: "pytest"
        versions:
          - ">=9.1.0"

  - package-ecosystem: docker
    directory: "/codex_bridge_app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
