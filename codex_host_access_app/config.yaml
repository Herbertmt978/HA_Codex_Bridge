name: Codex Host Access
version: "1.3.0"
slug: codex_host_access
description: Optional root commands on Home Assistant OS. Can access files, credentials, services and the network.
url: https://github.com/Herbertmt978/HA_Codex_Bridge
arch:
  - amd64
init: false
boot: manual
stage: experimental
image: ghcr.io/herbertmt978/ha-codex-bridge-app
host_pid: true
full_access: true
privileged:
  - SYS_ADMIN
  - SYS_PTRACE
  - DAC_READ_SEARCH
apparmor: false
discovery:
  - codex_bridge
environment:
  CODEX_BRIDGE_ROLE: host_access
options: {}
schema: {}
