name: Codex Bridge
version: "1.4.0"
slug: codex_bridge
description: Run the Codex Bridge service privately inside Home Assistant.
url: https://github.com/Herbertmt978/HA_Codex_Bridge
arch:
  - amd64
init: false
stage: stable
backup: cold
image: ghcr.io/herbertmt978/ha-codex-bridge-app
map:
  - app_config:rw
discovery:
  - codex_bridge
options:
  enable_mcp: false
  enable_local_mcp: false
  enable_browser: false
schema:
  enable_mcp: bool
  enable_local_mcp: bool
  enable_browser: bool
